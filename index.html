<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIT01 - Gestión e Innovación de la Tecnología</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">GIT</span>
                    <div class="logo-text">
                        <span class="logo-title">Gestión e Innovación</span>
                        <span class="logo-subtitle">de la Tecnología</span>
                    </div>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
            </div>

            <div class="sidebar-progress">
                <div class="progress-ring-container">
                    <svg class="progress-ring" width="80" height="80" viewBox="0 0 80 80">
                        <defs>
                            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#e879f9;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle class="progress-ring-bg" cx="40" cy="40" r="36"/>
                        <circle class="progress-ring-fill" id="progressRingFill" cx="40" cy="40" r="36"/>
                    </svg>
                    <div class="progress-text">
                        <span class="progress-percent" id="progressPercent">0%</span>
                        <span class="progress-label">Completado</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav" id="sidebarNav">
                <div class="nav-section">
                    <a href="#dashboard" class="nav-item nav-dashboard" data-route="dashboard">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                        <span>Dashboard</span>
                    </a>
                </div>
                <!-- Units will be generated by JS -->
            </nav>

            <div class="sidebar-footer">
                <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <span class="theme-label">Modo Oscuro</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" id="mainContent">
            <header class="content-header">
                <div class="header-left">
                    <h1 id="pageTitle">Dashboard de Aprendizaje</h1>
                    <p class="page-subtitle" id="pageSubtitle">Bienvenido a tu espacio de aprendizaje autoguiado</p>
                </div>
                <div class="header-right">
                    <div class="badges-container" id="badgesContainer"></div>
                </div>
            </header>

            <div class="content-body" id="contentBody">
                <!-- Dynamic content loads here -->
            </div>
        </main>
    </div>

    <!-- Quiz Modal -->
    <div class="modal-overlay" id="quizModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="quizModalTitle">Autoevaluación</h3>
                <button class="modal-close" id="quizModalClose" aria-label="Cerrar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body" id="quizModalBody"></div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
